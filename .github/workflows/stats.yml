name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual triggering

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate Github Stats Card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=HandyS11&show_icons=true&theme=transparent&number_format=short&include_all_commits=true&show=prs_merged
          path: generated/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=HandyS11&layout=compact&langs_count=12&theme=transparent&count_private=true&hide=dockerfile,powershell,html,css,php,objective-c,hack,qmake,batchfile,qml,groovy
          path: generated/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime Stats Card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=HandyS11&layout=compact&custom_title=WakaTime%20Stats%20(since%202024)&langs_count=20&hide=binary,other,ini,solution%20file,shproj,git%20config,project%20file%20properties&theme=transparent
          path: generated/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # The trophy card has no public API left (the Vercel instance returns 402
      # DEPLOYMENT_DISABLED), so run ryo-ma's own service locally and query it
      # with the query parameters documented in its README.
      - name: Checkout Trophy Generator
        uses: actions/checkout@v7
        with:
          repository: ryo-ma/github-profile-trophy
          ref: e3c89df995e92e67cdd4b2acaab9d974583dc1f7
          path: .trophy-src

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate GitHub Trophies
        working-directory: .trophy-src
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          PORT: "8080"
        run: |
          deno run -A main.ts &
          server_pid=$!
          trap 'kill "${server_pid}"' EXIT

          for _ in $(seq 1 60); do
            if curl -s -o /dev/null "http://localhost:${PORT}/"; then break; fi
            sleep 1
          done

          # Write to a scratch file first: --fail-with-body still writes the error
          # page, so only a validated SVG is allowed to replace the committed one.
          curl -sS --fail-with-body -o "${RUNNER_TEMP}/trophy.svg" \
            "http://localhost:${PORT}/?username=HandyS11&theme=onedark&row=1&column=7&margin-w=20&no-bg=true"

          grep -q "<svg" "${RUNNER_TEMP}/trophy.svg"
          mv "${RUNNER_TEMP}/trophy.svg" "${GITHUB_WORKSPACE}/generated/trophy.svg"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/*.svg
          git commit -m "chore: update profile stats [skip ci]" || exit 0
          git push
